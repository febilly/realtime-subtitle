name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Allow creating releases and pushing tags

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Print dependency versions
      shell: bash
      run: |
        python --version
        pip --version
        echo "::group::Top-level dependency versions"
        python - <<'PY'
        import re
        from importlib.metadata import PackageNotFoundError, version

        names = []
        with open("requirements.txt", encoding="utf-8") as fh:
            for line in fh:
                line = line.strip()
                if not line or line.startswith("#"):
                    continue
                name = re.split(r"[\s<>=!~;\[@]", line, 1)[0]
                if name:
                    names.append(name)

        width = max(len(n) for n in names)
        for name in names:
            try:
                installed = version(name)
            except PackageNotFoundError:
                installed = "NOT INSTALLED"
            print(f"{name.ljust(width)}  {installed}")
        PY
        echo "::endgroup::"
        echo "::group::Full pip freeze"
        pip freeze
        echo "::endgroup::"

    - name: Build executable with PyInstaller
      run: |
        python build_exe.py
    
    - name: Get commit info
      id: commit_info
      run: |
        $commitSha = "${{ github.sha }}".Substring(0, 7)
        $commitMsg = git log -1 --pretty=%B
        $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
        $tag = "v$timestamp-$commitSha"
        echo "sha=$commitSha" >> $env:GITHUB_OUTPUT
        echo "message=$commitMsg" >> $env:GITHUB_OUTPUT
        echo "timestamp=$timestamp" >> $env:GITHUB_OUTPUT
        echo "tag=$tag" >> $env:GITHUB_OUTPUT
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.commit_info.outputs.tag }}
        name: RealtimeSubtitle ${{ steps.commit_info.outputs.tag }}
        body: |
          ## Auto-built Release
          
          **Commit Message**: ${{ steps.commit_info.outputs.message }}
          **Commit SHA**: ${{ steps.commit_info.outputs.sha }}
          **Build Time**: ${{ steps.commit_info.outputs.timestamp }}
        files: ./dist/RealtimeSubtitle.exe
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: RealtimeSubtitle
        path: ./dist/RealtimeSubtitle.exe
        retention-days: 30
