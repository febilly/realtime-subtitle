name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Allow creating releases and pushing tags

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 官方 wheel 里的 bootloader（run.exe）是全世界所有 PyInstaller 打包产物共用
    # 的同一份二进制，大量恶意样本也用它，因此被不少杀软直接按特征码报毒。
    # 从源码重编译一份，产物的 bootloader 特征就与公版不同，可以躲掉这一类纯静态匹配。
    #
    # 注意：sdist 里同样附带了预编译的 bootloader，只加 --no-binary 是空操作，
    # 必须同时设置 PYINSTALLER_COMPILE_BOOTLOADER 才会真正调用 waf 编译。
    # 编译依赖 runner 自带的 MSVC 工具链。
    - name: Rebuild the PyInstaller bootloader from source
      shell: bash
      env:
        PYINSTALLER_COMPILE_BOOTLOADER: '1'
      run: |
        version=$(python -c "import PyInstaller; print(PyInstaller.__version__)")
        echo "Recompiling bootloader for PyInstaller $version"
        pip install --no-binary pyinstaller --no-cache-dir --force-reinstall --no-deps \
          "pyinstaller==$version"

    - name: Verify the bootloader is not the stock prebuilt one
      shell: bash
      run: |
        python - <<'PY'
        import hashlib
        import io
        import json
        import urllib.request
        import zipfile
        from pathlib import Path

        import PyInstaller

        name = "PyInstaller/bootloader/Windows-64bit-intel/run.exe"
        built = (Path(PyInstaller.__file__).parent / "bootloader/Windows-64bit-intel/run.exe").read_bytes()

        with urllib.request.urlopen(f"https://pypi.org/pypi/pyinstaller/{PyInstaller.__version__}/json") as response:
            metadata = json.load(response)
        url = next(u["url"] for u in metadata["urls"] if u["filename"].endswith("win_amd64.whl"))
        with urllib.request.urlopen(url) as response:
            stock = zipfile.ZipFile(io.BytesIO(response.read())).read(name)

        print("stock:", len(stock), hashlib.sha256(stock).hexdigest())
        print("built:", len(built), hashlib.sha256(built).hexdigest())
        if stock == built:
            raise SystemExit("ERROR: bootloader was NOT recompiled from source")
        print("OK: bootloader differs from the stock prebuilt binary")
        PY


    - name: Print dependency versions
      shell: bash
      run: |
        python --version
        pip --version
        echo "::group::Top-level dependency versions"
        python - <<'PY'
        import re
        from importlib.metadata import PackageNotFoundError, version

        names = []
        with open("requirements.txt", encoding="utf-8") as fh:
            for line in fh:
                line = line.strip()
                if not line or line.startswith("#"):
                    continue
                name = re.split(r"[\s<>=!~;\[@]", line, 1)[0]
                if name:
                    names.append(name)

        width = max(len(n) for n in names)
        for name in names:
            try:
                installed = version(name)
            except PackageNotFoundError:
                installed = "NOT INSTALLED"
            print(f"{name.ljust(width)}  {installed}")
        PY
        echo "::endgroup::"
        echo "::group::Full pip freeze"
        pip freeze
        echo "::endgroup::"

    - name: Build executable with PyInstaller
      run: |
        python packaging/build_exe.py

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: RealtimeSubtitle-windows
        path: ./dist/RealtimeSubtitle.exe
        retention-days: 30

  build-linux:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgirepository-2.0-dev \
          libglib2.0-dev \
          libcairo2-dev \
          libgtk-3-dev \
          gir1.2-glib-2.0 \
          gir1.2-webkit2-4.1 \
          libwebkit2gtk-4.1-0 \
          libopus0 \
          libopus-dev \
          pulseaudio-utils \
          libxcb-cursor0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-shape0 \
          libxcb-xkb1 \
          libxkbcommon-x11-0 \
          pkg-config \
          meson \
          cmake \
          file \
          desktop-file-utils

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyinstaller==6.22.2

    - name: Build Linux bundle with PyInstaller
      env:
        RTS_ONEDIR: '1'
      run: |
        python packaging/build_exe.py

    - name: Package AppImage
      run: |
        chmod +x packaging/build_appimage.sh
        bash packaging/build_appimage.sh

    - name: Smoke test AppImage CLI entrypoint
      run: |
        APPIMAGE_EXTRACT_AND_RUN=1 ./dist/RealtimeSubtitle-linux-x86_64.AppImage --help
        APPIMAGE_EXTRACT_AND_RUN=1 ./dist/RealtimeSubtitle-linux-x86_64.AppImage --probe-local-gpus

    - name: Upload Linux AppImage artifact
      uses: actions/upload-artifact@v4
      with:
        name: RealtimeSubtitle-linux-appimage
        path: ./dist/RealtimeSubtitle-linux-x86_64.AppImage
        retention-days: 30

  release:
    needs: [build, build-linux]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./release-artifacts
        merge-multiple: true

    - name: Get commit info
      id: commit_info
      run: |
        commit_sha=$(printf '%s' "${{ github.sha }}" | cut -c1-7)
        commit_msg=$(git log -1 --pretty=%B)
        timestamp=$(date -u +"%Y%m%d-%H%M%S")
        tag="v${timestamp}-${commit_sha}"
        echo "sha=${commit_sha}" >> "$GITHUB_OUTPUT"
        echo "timestamp=${timestamp}" >> "$GITHUB_OUTPUT"
        echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        {
          echo "message<<EOF"
          echo "${commit_msg}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.commit_info.outputs.tag }}
        name: RealtimeSubtitle ${{ steps.commit_info.outputs.tag }}
        body: |
          ## Auto-built Release

          **Commit Message**: ${{ steps.commit_info.outputs.message }}
          **Commit SHA**: ${{ steps.commit_info.outputs.sha }}
          **Build Time**: ${{ steps.commit_info.outputs.timestamp }}
        files: |
          ./release-artifacts/RealtimeSubtitle.exe
          ./release-artifacts/RealtimeSubtitle-linux-x86_64.AppImage
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
