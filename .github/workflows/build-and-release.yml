name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Allow creating releases and pushing tags

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 官方 wheel 里的 bootloader（run.exe）是全世界所有 PyInstaller 打包产物共用
    # 的同一份二进制，大量恶意样本也用它，因此被不少杀软直接按特征码报毒。
    # 从源码重编译一份，产物的 bootloader 特征就与公版不同，可以躲掉这一类纯静态匹配。
    #
    # 注意：sdist 里同样附带了预编译的 bootloader，只加 --no-binary 是空操作，
    # 必须同时设置 PYINSTALLER_COMPILE_BOOTLOADER 才会真正调用 waf 编译。
    # 编译依赖 runner 自带的 MSVC 工具链。
    - name: Rebuild the PyInstaller bootloader from source
      shell: bash
      env:
        PYINSTALLER_COMPILE_BOOTLOADER: '1'
      run: |
        version=$(python -c "import PyInstaller; print(PyInstaller.__version__)")
        echo "Recompiling bootloader for PyInstaller $version"
        pip install --no-binary pyinstaller --no-cache-dir --force-reinstall --no-deps \
          "pyinstaller==$version"

    - name: Verify the bootloader is not the stock prebuilt one
      shell: bash
      run: |
        python - <<'PY'
        import hashlib
        import io
        import json
        import urllib.request
        import zipfile
        from pathlib import Path

        import PyInstaller

        name = "PyInstaller/bootloader/Windows-64bit-intel/run.exe"
        built = (Path(PyInstaller.__file__).parent / "bootloader/Windows-64bit-intel/run.exe").read_bytes()

        with urllib.request.urlopen(f"https://pypi.org/pypi/pyinstaller/{PyInstaller.__version__}/json") as response:
            metadata = json.load(response)
        url = next(u["url"] for u in metadata["urls"] if u["filename"].endswith("win_amd64.whl"))
        with urllib.request.urlopen(url) as response:
            stock = zipfile.ZipFile(io.BytesIO(response.read())).read(name)

        print("stock:", len(stock), hashlib.sha256(stock).hexdigest())
        print("built:", len(built), hashlib.sha256(built).hexdigest())
        if stock == built:
            raise SystemExit("ERROR: bootloader was NOT recompiled from source")
        print("OK: bootloader differs from the stock prebuilt binary")
        PY


    - name: Print dependency versions
      shell: bash
      run: |
        python --version
        pip --version
        echo "::group::Top-level dependency versions"
        python - <<'PY'
        import re
        from importlib.metadata import PackageNotFoundError, version

        names = []
        with open("requirements.txt", encoding="utf-8") as fh:
            for line in fh:
                line = line.strip()
                if not line or line.startswith("#"):
                    continue
                name = re.split(r"[\s<>=!~;\[@]", line, 1)[0]
                if name:
                    names.append(name)

        width = max(len(n) for n in names)
        for name in names:
            try:
                installed = version(name)
            except PackageNotFoundError:
                installed = "NOT INSTALLED"
            print(f"{name.ljust(width)}  {installed}")
        PY
        echo "::endgroup::"
        echo "::group::Full pip freeze"
        pip freeze
        echo "::endgroup::"

    - name: Build executable with PyInstaller
      run: |
        python build_exe.py
    
    - name: Get commit info
      id: commit_info
      run: |
        $commitSha = "${{ github.sha }}".Substring(0, 7)
        $commitMsg = git log -1 --pretty=%B
        $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
        $tag = "v$timestamp-$commitSha"
        echo "sha=$commitSha" >> $env:GITHUB_OUTPUT
        echo "message=$commitMsg" >> $env:GITHUB_OUTPUT
        echo "timestamp=$timestamp" >> $env:GITHUB_OUTPUT
        echo "tag=$tag" >> $env:GITHUB_OUTPUT
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.commit_info.outputs.tag }}
        name: RealtimeSubtitle ${{ steps.commit_info.outputs.tag }}
        body: |
          ## Auto-built Release
          
          **Commit Message**: ${{ steps.commit_info.outputs.message }}
          **Commit SHA**: ${{ steps.commit_info.outputs.sha }}
          **Build Time**: ${{ steps.commit_info.outputs.timestamp }}
        files: ./dist/RealtimeSubtitle.exe
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: RealtimeSubtitle
        path: ./dist/RealtimeSubtitle.exe
        retention-days: 30
